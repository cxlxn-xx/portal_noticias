<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Panel de Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Panel de Noticias</h2>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
        </form>
    </div>

    <a th:href="@{/portal/admin/publicacion/form}" class="btn btn-success mb-3">+ Redactar Nueva Noticia</a>

    <table class="table table-bordered table-striped shadow-sm">
        <thead class="table-dark">
        <tr><th>ID</th><th>Título</th><th>Tema</th><th>Prioridad</th><th>Estado</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${publicaciones}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.titulo}"></td>
            <td th:text="${p.tema != null ? p.tema.nombre : 'Sin Tema'}"></td>
            <td th:text="${p.prioridad}"></td>
            <td>
                <span class="badge bg-info text-dark" th:text="${p.estado}"></span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
