<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Nueva Noticia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="card shadow col-md-8 mx-auto">
        <div class="card-header bg-primary text-white"><h4>Redactar Noticia</h4></div>
        <div class="card-body">
            <form th:action="@{/portal/admin/publicacion/guardar}" method="post">
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control" name="titulo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Copete / Descripción</label>
                    <input type="text" class="form-control" name="descripcion" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contenido de la Nota</label>
                    <textarea class="form-control" name="contenido" rows="5" required></textarea>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha de Publicación</label>
                        <input type="date" class="form-control" name="fechaPublicacion" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Prioridad</label>
                        <select class="form-select" name="prioridad">
                            <option value="ALTA">Alta</option>
                            <option value="MEDIA">Media</option>
                            <option value="NORMAL">Normal</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Estado</label>
                        <select class="form-select" name="estado">
                            <option value="PUBLICADA">Publicada</option>
                            <option value="BORRADOR">Borrador</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tema</label>
                        <select class="form-select" name="tema.id" required>
                            <option value="">Seleccione un tema...</option>
                            <option th:each="t : ${temas}" th:value="${t.id}" th:text="${t.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Autor Principal</label>
                        <select class="form-select" name="idAutor" required>
                            <option value="">Seleccione un autor...</option>
                            <option th:each="a : ${autores}" th:value="${a.id}" th:text="${a.apellido + ', ' + a.nombre}"></option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Guardar Noticia</button>
                <a th:href="@{/portal/admin}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
