<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Noticias Públicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">Portal de Noticias</a>
    <a th:href="@{/login}" class="btn btn-outline-light">Acceso Admin</a>
</nav>
<div class="container mt-4">
    <h2>Últimas Noticias</h2>
    <div class="row">
        <div class="col-md-4 mb-3" th:each="p : ${publicaciones}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.titulo}"></h5>
                    <p class="card-text" th:text="${p.descripcion}"></p>
                    <p class="text-muted" th:text="${p.fechaPublicacion}"></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
